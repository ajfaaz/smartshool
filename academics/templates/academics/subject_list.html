{% extends "base.html" %}

{% block title %}Subjects{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Subjects</h2>
            <a href="{% url 'add_subject' %}" class="btn btn-success">Add Subject</a>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>School</th>
                        <th>Subject Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in subjects %}
                    <tr>
                        <td>{{ s.school.name }}</td>
                        <td>{{ s.name }}</td>
                        <td>
                            <a href="{% url 'delete_subject' s.id %}" class="btn btn-sm btn-danger">Delete</a>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="3" class="text-center">No subjects found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
