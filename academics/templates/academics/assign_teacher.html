{% extends "base.html" %}

{% block title %}Assign Teacher{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h3 class="mb-4">Assign Teacher to Subject</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Teacher</label>
                <select name="teacher" class="form-select" required>
                    <option value="" selected disabled>Select Teacher</option>
                    {% for t in teachers %}
                    <option value="{{ t.id }}">{{ t.name }} - {{ t.school.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Subject</label>
                <select name="subject" class="form-select" required>
                    <option value="" selected disabled>Select Subject</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }} - {{ s.school.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Class</label>
                <select name="student_class" class="form-select" required>
                    <option value="" selected disabled>Select Class</option>
                    {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.name }} - {{ c.school.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Assign Now</button>
            <a href="{% url 'teacher_subject_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
