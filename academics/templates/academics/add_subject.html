{% extends "base.html" %}

{% block title %}Add Subject{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h3 class="mb-4">Add New Subject</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Subject Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Mathematics" required>
            </div>
            <button type="submit" class="btn btn-primary">Save Subject</button>
            <a href="{% url 'subject_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
