{% extends "base.html" %}

{% block title %}Add Result{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h3 class="mb-4">Record Student Result</h3>
        <form method="POST">
            {% csrf_token %}
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Student</label>
                    <select name="student" class="form-select" required>
                        <option value="" disabled selected>Select Student</option>
                        {% for s in students %}
                        <option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <select name="subject" class="form-select" required>
                    <option value="" disabled selected>Select Subject</option>
                    {% for s in subjects %}
                    <option value="{{ s.id }}">{{ s.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="form-label">CA 1</label>
                    <input type="number" name="ca1" class="form-control" placeholder="0" min="0" max="100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">CA 2</label>
                    <input type="number" name="ca2" class="form-control" placeholder="0" min="0" max="100" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Exam</label>
                    <input type="number" name="exam" class="form-control" placeholder="0" min="0" max="100" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Teacher Comment</label>
                <textarea name="teacher_comment" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Principal Comment</label>
                <textarea name="principal_comment" class="form-control" rows="2"></textarea>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">Save Result</button>
                <a href="{% url 'result_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
