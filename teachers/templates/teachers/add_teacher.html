{% extends "base.html" %}

{% block title %}Add Teacher{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h2 class="h3 mb-4">Add New Teacher</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" placeholder="Phone Number" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="teacher@example.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">School</label>
                    <input type="text" class="form-control" value="{{ school.name }}" disabled>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="teacher.username" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="col-12">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label mb-0">Teaching Assignments</label>
                        <button type="button" class="btn btn-sm btn-outline-primary" id="add-assignment-row">Add Another</button>
                    </div>
                    <div id="assignment-rows" class="d-grid gap-3">
                        <div class="row g-3 assignment-row">
                            <div class="col-md-6">
                                <label class="form-label">Subject</label>
                                <select name="assignment_subject[]" class="form-select" required>
                                    <option value="" selected disabled>Select subject</option>
                                    {% for subject in subjects %}
                                    <option value="{{ subject.id }}">{{ subject.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label">Class</label>
                                <select name="assignment_class[]" class="form-select" required>
                                    <option value="" selected disabled>Select class</option>
                                    {% for class in classes %}
                                    <option value="{{ class.id }}">{{ class.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-1 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-danger w-100 remove-assignment-row">X</button>
                            </div>
                        </div>
                    </div>
                    <div class="form-text">Add as many subject/class combinations as this teacher handles.</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Save Teacher</button>
                <a href="{% url 'teacher_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<template id="assignment-row-template">
    <div class="row g-3 assignment-row">
        <div class="col-md-6">
            <label class="form-label">Subject</label>
            <select name="assignment_subject[]" class="form-select" required>
                <option value="" selected disabled>Select subject</option>
                {% for subject in subjects %}
                <option value="{{ subject.id }}">{{ subject.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-5">
            <label class="form-label">Class</label>
            <select name="assignment_class[]" class="form-select" required>
                <option value="" selected disabled>Select class</option>
                {% for class in classes %}
                <option value="{{ class.id }}">{{ class.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-1 d-flex align-items-end">
            <button type="button" class="btn btn-outline-danger w-100 remove-assignment-row">X</button>
        </div>
    </div>
</template>

<script>
    (function () {
        const rowsContainer = document.getElementById("assignment-rows");
        const addButton = document.getElementById("add-assignment-row");
        const template = document.getElementById("assignment-row-template");

        function wireRemoveButtons() {
            rowsContainer.querySelectorAll(".remove-assignment-row").forEach(function (button) {
                button.onclick = function () {
                    const rows = rowsContainer.querySelectorAll(".assignment-row");
                    if (rows.length === 1) {
                        return;
                    }
                    button.closest(".assignment-row").remove();
                };
            });
        }

        addButton.addEventListener("click", function () {
            rowsContainer.appendChild(template.content.cloneNode(true));
            wireRemoveButtons();
        });

        wireRemoveButtons();
    })();
</script>
{% endblock %}
