{% extends "base.html" %}

{% block title %}Edit Parent{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h2 class="h3 mb-4">Edit Parent</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Parent Name</label>
                    <input type="text" name="name" class="form-control" value="{{ parent.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ parent.phone }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ parent.user.username }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ parent.user.email }}" placeholder="parent@example.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">New Password</label>
                    <input type="password" name="password" class="form-control">
                    <div class="form-text">Leave blank to keep the current password.</div>
                </div>
                <div class="col-12">
                    <label class="form-label">Linked Students</label>
                    <select name="students" class="form-select" multiple required size="8">
                        {% for student in students %}
                        <option value="{{ student.id }}" {% if student in parent.linked_students %}selected{% endif %}>
                            {{ student.name }} - {{ student.current_class }}
                        </option>
                        {% endfor %}
                    </select>
                    <div class="form-text">Hold Ctrl or Cmd to select multiple children.</div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Update Parent</button>
                <a href="{% url 'parent_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
