{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h2 class="h3 mb-4">Add Student</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Admission Number</label>
                    <input type="text" name="admission_number" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Class</label>
                    <select name="current_class" class="form-select" required>
                        {% for class in classes %}
                        <option value="{{ class.name }}">{{ class.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Student Email</label>
                    <input type="email" name="email" class="form-control" placeholder="student@example.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Portal Password</label>
                    <input type="password" name="password" class="form-control">
                    <div class="form-text">Leave blank to use the default password `student123`.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="date_of_birth" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Parent Phone</label>
                    <input type="text" name="parent_phone" class="form-control">
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">Save Student</button>
                <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Back</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
