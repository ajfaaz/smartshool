{% extends "base.html" %}

{% block title %}Edit Student{% endblock %}

{% block content %}
<div class="panel-card card">
    <div class="card-body p-4 p-md-5">
        <h2 class="h3 mb-4">Edit Student</h2>
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="name" value="{{ student.name }}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Admission Number</label>
                    <input type="text" name="admission_number" value="{{ student.admission_number }}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Class</label>
                    <select name="current_class" class="form-select" required>
                        {% for class in classes %}
                        <option value="{{ class.name }}" {% if student.current_class == class.name %}selected{% endif %}>{{ class.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Student Email</label>
                    <input type="email" name="email" value="{{ student.email }}" class="form-control" placeholder="student@example.com">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Reset Portal Password</label>
                    <input type="password" name="password" class="form-control">
                    <div class="form-text">Leave blank to keep the current student password.</div>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="date_of_birth" value="{{ student.date_of_birth|date:'Y-m-d' }}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Parent Phone</label>
                    <input type="text" name="parent_phone" value="{{ student.parent_phone }}" class="form-control">
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success">Update Student</button>
                <a href="{% url 'student_list' %}" class="btn btn-outline-secondary">Back</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
